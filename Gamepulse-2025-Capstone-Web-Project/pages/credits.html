    <ul class="space-y-3 list-disc pl-6">
      <li><a class="text-sky-300 underline underline-offset-4 hover:text-sky-200" href="https://rawg.io" target="_blank" rel="noopener noreferrer">RAWG Video Games Database API</a>: covers, release dates, and ratings</li>
      <li><a class="text-sky-300 underline underline-offset-4 hover:text-sky-200" href="https://www.igdb.com" target="_blank" rel="noopener noreferrer">IGDB</a>: critic and user ratings</li>
      <li><a class="text-sky-300 underline underline-offset-4 hover:text-sky-200" href="https://steamdb.info" target="_blank" rel="noopener noreferrer">SteamDB</a>: peak player counts</li>
