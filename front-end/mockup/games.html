<!DOCTYPE html>
<html lang="en">
<head>
  <title>GamesPulse Capstone | Most Played Games of 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../Gamespulse-Capstone-Mobile-Project-main/output.css" rel="stylesheet">
</head>
<body style="font-family: Arial, Helvetica, sans-serif;" class="bg-gray-900 text-gray-200 leading-relaxed">

  <header class="bg-gray-800 border-b border-gray-700">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4 p-4">
      <a href="home.html" aria-label="GamesPulse home" class="text-2xl font-bold tracking-wide text-gray-50 focus:outline-none focus:ring-2 focus:ring-sky-300">Games<span class="text-sky-300">Pulse</span></a>
      <nav id="nav-list" aria-label="Main">
        <ul class="flex flex-wrap gap-3">
          <li><a href="about.html" class="inline-block bg-gray-700 hover:bg-gray-600 text-gray-50 font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300">About</a></li>
          <li><a href="credits.html" class="inline-block bg-gray-700 hover:bg-gray-600 text-gray-50 font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300">Credits</a></li>
          <li><a href="account.html" class="inline-block bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300">Sign In</a></li>
          <li><a href="games.html" class="inline-block bg-gray-700 hover:bg-gray-600 text-gray-50 font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300">Games</a></li>
          <li><a href="home.html" class="inline-block bg-gray-700 hover:bg-gray-600 text-gray-50 font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300">Home</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-8">
    <div class="space-y-1">
      <h1 class="text-4xl font-bold text-gray-50">Most Played Games of 2025</h1>
      <p id="collected" class="text-sm text-gray-300"></p>
    </div>

    <div class="grid gap-6 md:grid-cols-2 items-start">

      <!-- PAY TO PLAY (left) -->
      <section aria-labelledby="paid-heading" class="bg-indigo-950/60 border-2 border-indigo-400 p-5">
        <h2 id="paid-heading" class="text-3xl font-bold text-indigo-200 mb-4">Pay to Play</h2>
        <ol id="paid-list" class="list-decimal pl-6 divide-y divide-indigo-400/30">
          <li class="py-2">Loading...</li>
        </ol>
      </section>

      <!-- FREE TO PLAY (right) -->
      <section aria-labelledby="free-heading" class="bg-emerald-950/60 border-2 border-emerald-400 p-5">
        <h2 id="free-heading" class="text-3xl font-bold text-emerald-200 mb-4">Free to Play</h2>
        <ol id="free-list" class="list-decimal pl-6 divide-y divide-emerald-400/30">
          <li class="py-2">Loading...</li>
        </ol>
      </section>

    </div>
  </main>

  <script src="../Gamespulse-Capstone-Mobile-Project-main/games.js"></script>
</body>
</html>
